services:
  cinevault:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # Keep the backend private until an HTTPS reverse proxy with real viewer
      # authentication is configured.  Override CINEVAULT_BIND_HOST explicitly
      # only when that boundary exists.
      - "${CINEVAULT_BIND_HOST:-127.0.0.1}:${CINEVAULT_PORT:-8081}:8081"
    environment:
      CINEVAULT_ADMIN_TOKEN: ${CINEVAULT_ADMIN_TOKEN:?set CINEVAULT_ADMIN_TOKEN in .env}
      # The browser has no token-login screen yet.  Leave this empty for a
      # private localhost deployment; use reverse-proxy authentication before
      # exposing the app to the public internet.
      CINEVAULT_VIEWER_TOKEN: ${CINEVAULT_VIEWER_TOKEN:-}
      CINEVAULT_TMDB_API_TOKEN: ${CINEVAULT_TMDB_API_TOKEN:-}
      CINEVAULT_SERVICE_DIR: /opt/cinevault
      CINEVAULT_KINOPOISK_UPDATER_DIR: /opt/cinevault/kinopoisk_media_system_fixed
      CINEVAULT_APBUGALL_TOKEN: ${CINEVAULT_APBUGALL_TOKEN:-}
      CINEVAULT_DEVICE_FP: ${CINEVAULT_DEVICE_FP:-}
      CINEVAULT_IFRAME_REQUEST_ID: ${CINEVAULT_IFRAME_REQUEST_ID:-}
    volumes:
      - ${CINEVAULT_DATA_DIR:-./data/media-library}:/data/media-library
      - ${CINEVAULT_INBOX_DIR:-./inbox}:/inbox:ro
      # Catalog metadata is updated by the separate maintenance job. Mount it
      # so the running backend sees new cards without a player restart.
      - ./app/data:/opt/cinevault/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
  catalog-sync:
    build: .
    profiles: ["maintenance"]
    user: "0:0"
    entrypoint: ["python", "tools/sync_tmdb_catalog.py"]
    command: ["--mode", "daily", "--pages", "${CINEVAULT_TMDB_CATALOG_DAILY_PAGES:-2}"]
    environment:
      CINEVAULT_TMDB_API_TOKEN: ${CINEVAULT_TMDB_API_TOKEN:-}
    volumes:
      - ./app/data:/opt/cinevault/app/data
  kinopoisk-catalog-sync:
    build: .
    profiles: ["maintenance"]
    user: "0:0"
    entrypoint: ["python", "tools/sync_kinopoisk_dev_catalog.py"]
    command:
      - --mode
      - ${CINEVAULT_KINOPOISK_CATALOG_MODE:-daily}
      - --kind
      - ${CINEVAULT_KINOPOISK_CATALOG_KIND:-all}
      - --pages
      - ${CINEVAULT_KINOPOISK_CATALOG_PAGES:-2}
      - --limit
      - ${CINEVAULT_KINOPOISK_CATALOG_PAGE_LIMIT:-100}
      - --lookback-days
      - ${CINEVAULT_KINOPOISK_CATALOG_LOOKBACK_DAYS:-7}
    environment:
      CINEVAULT_KINOPOISK_DEV_TOKEN: ${CINEVAULT_KINOPOISK_DEV_TOKEN:-}
    volumes:
      - ./app/data:/opt/cinevault/app/data
      - ${CINEVAULT_DATA_DIR:-./data/media-library}:/opt/cinevault/data/media-library
